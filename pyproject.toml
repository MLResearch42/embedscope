[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "embedscope"
version = "0.1.0"
description = "Interactive charts to look inside your text embeddings. A maintained fork of cluestar."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "MLResearch42" }]
requires-python = ">=3.10"
dependencies = [
    "altair>=5.1.0",
    "numpy>=1.21",
    "pandas>=1.5",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]
keywords = ["embeddings", "text", "clustering", "visualization", "altair", "nlp"]

[project.optional-dependencies]
widget = ["anywidget>=0.9"]
dev = [
    "anywidget>=0.9",
    "pytest>=7",
    "pytest-cov",
    "black",
    "flake8",
    "pre-commit",
    "jupyterlab",
]

[project.urls]
Documentation = "https://github.com/MLResearch42/embedscope"
"Source Code" = "https://github.com/MLResearch42/embedscope"
"Issue Tracker" = "https://github.com/MLResearch42/embedscope/issues"

[tool.setuptools.packages.find]
include = ["embedscope*"]
